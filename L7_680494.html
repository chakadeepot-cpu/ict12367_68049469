<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="Style.CSS">
    <script src="scripts.js"></script>
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">AOMSIN</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="#">Home <span class="sr-only">(current)</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Features</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Pricing</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="background-container">
        <video id="videoPlayer" autoplay loop muted>
            <source src="242945_small.mp4" type="video/mp4">
        </video>

        <div class="form-container">
            <form action="#" method="post">
                <h2>แบบฟอร์มลงทะเบียน</h2>
                
                <div>
                    <label for="fullname">ชื่อ-นามสกุล:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="กรุณากรอกชื่อ-นามสกุล" required>
                </div>
                
                <div>
                    <label for="email">อีเมล:</label>
                    <input type="email" id="email" name="email" placeholder="example@domain.com" required>
                </div>
                
                <div>
                    <label for="password">รหัสผ่าน:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div>
                    <label>เพศ:</label>
                    <div class="gender-options">
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male">ชาย</label>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">หญิง</label>
                    </div>
                </div>
                
                <div>
                    <label>ตำแหน่ง:</label>
                    <div class="interest-options">
                        <input type="checkbox" id="web" name="interests[]" value="web">
                        <label for="web">Web Development</label>
                        <input type="checkbox" id="mobile" name="interests[]" value="mobile">
                        <label for="mobile">Mobile App</label>
                    </div>
                </div>
                
                <div>
                    <button type="submit" class="btn btn-primary">ลงทะเบียน</button>
                    <button type="reset" class="btn btn-danger">ล้างข้อมูล</button>
                </div>
            </form>
        </div>

        <div class="video-controls">
            <button class="btn btn-warning" onclick="playVideo()">
                <i class="bi bi-play-circle"></i> Play
            </button>
            <button class="btn btn-danger" onclick="pauseVideo()">
                <i class="bi bi-stop-circle"></i> Stop
            </button>
        </div>
    </div>

</body>
</html>

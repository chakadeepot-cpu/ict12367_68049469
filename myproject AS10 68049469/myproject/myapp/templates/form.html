<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Form | Luxury Entry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;400&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #05070a;
            color: white;
            font-family: 'Kanit', sans-serif;
            display: flex;
            align-items: center;
            min-height: 100vh;
        }
        .form-container {
            max-width: 450px;
            width: 100%;
            margin: auto;
            padding: 50px;
            background: linear-gradient(145deg, #0a0f18, #05070a);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        .form-label { font-size: 12px; letter-spacing: 2px; color: #64748b; text-transform: uppercase; }
        .form-control {
            background: transparent;
            border: none;
            border-bottom: 1px solid #1e293b;
            border-radius: 0;
            color: white;
            padding: 15px 0;
            transition: 0.4s;
        }
        .form-control:focus {
            background: transparent;
            border-color: #d4af37;
            box-shadow: none;
            color: white;
        }
        .btn-save {
            background: #d4af37;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 15px;
            width: 100%;
            font-weight: 600;
            margin-top: 30px;
            transition: 0.3s;
        }
        .btn-save:hover { background: white; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,255,255,0.1); }
        .back-btn { color: #475569; text-decoration: none; font-size: 13px; transition: 0.3s; }
        .back-btn:hover { color: white; }
    </style>
</head>
<body>
<div class="form-container">
    <div class="text-center mb-5">
        <h3 style="font-weight: 200; letter-spacing: 5px;">MEMBER <span style="color:#d4af37">ENTRY</span></h3>
    </div>
    
    <form method="post" action="">
        {% csrf_token %}
        <div class="mb-4">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" name="name" value="{{ person.name|default:'' }}" placeholder="ENTER NAME" required>
        </div>
        <div class="mb-4">
            <label class="form-label">Age</label>
            <input type="number" class="form-control" name="age" value="{{ person.age|default:'' }}" placeholder="ENTER AGE" required>
        </div>
        <button type="submit" class="btn btn-save">SAVE RECORD</button>
        <div class="text-center mt-4">
            <a href="/" class="back-btn">CANCEL</a>
        </div>
    </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ICT12367 | Premium Registry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-bg: #05070a;
            --glass: rgba(255, 255, 255, 0.03);
        }
        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at 50% -20%, #1e293b, #05070a);
            color: #e2e8f0;
            min-height: 100vh;
        }
        .luxury-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        h2 { font-weight: 200; letter-spacing: 2px; color: rgb(230, 170, 40); }
        .btn-add {
            background: transparent;
            border: 1px solid var(--primary-gold);
            color: var(--primary-gold);
            border-radius: 50px;
            padding: 10px 25px;
            transition: 0.4s;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .btn-add:hover { background: var(--primary-gold); color: black; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        
        .table { color: #94a3b8; border-color: rgba(255,255,255,0.05); }
        .table thead th { font-weight: 400; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; border: none; }
        .table tbody tr { transition: 0.3s; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .table tbody tr:hover { background: rgba(255,255,255,0.02); color: white; }
        
        /* ปุ่มแก้ไข/ลบ แบบ Minimal */
        .btn-premium { font-size: 13px; border-radius: 8px; padding: 5px 15px; text-decoration: none; transition: 0.3s; }
        .edit-link { color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.2); }
        .edit-link:hover { background: #60a5fa; color: white; }
        .delete-link { color: #f87171; border: 1px solid rgba(248, 113, 113, 0.2); margin-left: 5px; }
        .delete-link:hover { background: #f87171; color: white; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="luxury-card">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2>RESIDENTS <span style="color: var(--primary-gold);">LIST</span></h2>
            <a href="/form/" class="btn-add">+ Add Record</a>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>NAME</th>
                        <th>AGE</th>
                        <th class="text-end">ACTIONS</th>
                    </tr>
                </thead>
                <tbody>
                    {% for person in all_person %}
                    <tr>
                        <td style="color: var(--primary-gold);">#{{ person.id }}</td>
                        <td>{{ person.name }}</td>
                        <td>{{ person.age }} YRS</td>
                        <td class="text-end">
                            <a href="/edit/{{ person.id }}" class="btn-premium edit-link">EDIT</a>
                            <a href="/delete/{{ person.id }}" class="btn-premium delete-link" onclick="return confirm('Confirm delete?')">DELETE</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="4" class="text-center py-5">NO DATA AVAILABLE</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
